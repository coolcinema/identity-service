asyncapi: "3.0.0"
info:
  title: Identity Service
  version: 1.0.0

channels:
  userEvents:
    address: identity.user-events
    messages:
      userCreated:
        $ref: "#/components/messages/UserCreated"

operations:
  publishUserCreated:
    action: send
    channel:
      $ref: "#/channels/userEvents"
    messages:
      - $ref: "#/components/messages/UserCreated"

components:
  messages:
    UserCreated:
      payload:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
            format: email
